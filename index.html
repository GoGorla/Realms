<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plains Knights</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}
.box{background:#222;border:2px solid #555;border-radius:10px;padding:16px;max-width:760px;width:94%;max-height:90vh;overflow:auto}
button,input{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #666;background:#333;color:#eee;margin:2px}
button{cursor:pointer}button:hover{background:#484848}
.cls{display:inline-block;width:118px;padding:8px;margin:3px;border:3px solid #444;border-radius:8px;cursor:pointer;font-size:12px;vertical-align:top}
.cls.sel{border-color:#fff}.tabs button.on{background:#666}
.it{display:inline-block;margin:3px;padding:5px;border:2px solid;border-radius:6px;font-size:12px;width:140px;vertical-align:top}
#hud{position:fixed;left:8px;top:8px;font-size:13px;text-shadow:0 0 3px #000;pointer-events:none}
#toast{position:fixed;left:50%;top:10px;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 0 3px #000}
.bar{width:200px;height:12px;background:#400;border:1px solid #000}.bar i{display:block;height:100%;background:#d33}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="toast"></div>
<div id="ui"></div>
<script>
// ---------- data ----------
const CLS={
Knight:{c:'#4a90e2',hp:1.25,wpn:2,elem:1,luck:1,regen:1,phys:1,spd:1,start:'Iron Sword',d:'Weapon 2x, Health 1.25x'},
Sorcerer:{c:'#b04ae2',hp:.5,wpn:1,elem:3,luck:1.5,regen:1,phys:1,spd:1,start:'Fire Staff',d:'Elemental 3x, Health 0.5x, Luck 1.5x'},
Orc:{c:'#5a9a3a',hp:.75,wpn:3,elem:1,luck:1,regen:1.5,phys:1,spd:1,start:'Stone Club',d:'Weapon 3x, Health 0.75x, Regen 1.5x'},
Druid:{c:'#2ea88a',hp:2,wpn:1,elem:1,luck:1,regen:2,phys:1,spd:1,start:'Thorn Staff',d:'Health 2x, Regen 2x'},
Rogue:{c:'#e2c14a',hp:1,wpn:1,elem:1,luck:2,regen:1,phys:.5,spd:2,start:'Dagger',d:'Luck 2x, Speed 2x, Physical 0.5x'},
Barbarian:{c:'#d9482b',hp:.5,wpn:2,elem:1,luck:1,regen:.5,phys:2,spd:2,start:'Great Axe',d:'Health 0.5x, Regen 0.5x, Physical 2x, Weapon 2x, Speed 2x'}};
const RAR=['Common','Unusual','Rare','Epic','Legendary','Mythic','Ultra','Super','Eternal'];
const RC=['#7eef6d','#ffe65d','#4d52e3','#861fde','#de1f1f','#1fdbde','#ff2b75','#2bffa3','#555'];
const CRAFT=[.64,.32,.16,.08,.04,.02,.01,.001];
const IT={ // t: weapon/armor/boots/charm, b: base, e: elemental
'Iron Sword':{t:'weapon',b:12},'Stone Club':{t:'weapon',b:10},'Dagger':{t:'weapon',b:8,cd:.25},'Great Axe':{t:'weapon',b:16,cd:.6},
'Fire Staff':{t:'weapon',b:11,e:1},'Thorn Staff':{t:'weapon',b:9,e:1},'Frost Wand':{t:'weapon',b:10,e:1,cd:.3},
'Leather Armor':{t:'armor',b:2},'Chain Mail':{t:'armor',b:4},
'Leather Boots':{t:'boots',b:.05},'Swift Boots':{t:'boots',b:.1},
'Lucky Clover':{t:'charm',b:.15},'Bone Charm':{t:'charm',b:.1}};
const SLOTS=['weapon','armor','boots','charm'];
const MT={
stone:{hp:40,sp:0,c:'#888',r:18,dm:2,xp:5,coin:[0,2],drops:['Stone Club','Leather Boots']},
soldier:{hp:70,sp:1.8,c:'#c33',r:16,dm:8,xp:12,coin:[1,4],drops:['Iron Sword','Chain Mail','Great Axe']},
witch:{hp:50,sp:1.2,c:'#93c',r:15,rng:1,xp:15,coin:[2,5],drops:['Fire Staff','Frost Wand','Thorn Staff','Lucky Clover']},
zombie:{hp:90,sp:1,c:'#4a4',r:17,dm:10,xp:14,coin:[1,3],drops:['Bone Charm','Dagger','Leather Armor']},
villager:{hp:25,sp:1.4,c:'#fca',r:13,dm:0,flee:1,xp:4,coin:[5,12],drops:['Swift Boots','Lucky Clover']}};
const W=3200,H=3200;
const VILL=[[600,600],[2600,700],[1600,1600],[700,2500],[2500,2600]];
const SHOPS=[[1000,1000],[2200,1200],[1200,2200],[2300,2300],[1600,500]];
let uid=1;
const mk=(name,ri)=>({id:uid++,name,ri,...IT[name]});
const key=i=>i.name+i.ri;
const rr=a=>a[Math.random()*a.length|0];

// ---------- accounts (local, per browser) ----------
const $=id=>document.getElementById(id);
const ui=$('ui');
const users=()=>JSON.parse(localStorage.getItem('pk_users')||'{}');
const saveUsers=u=>localStorage.setItem('pk_users',JSON.stringify(u));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pk'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let S=null,pickCls='Knight';
function authScreen(msg=''){
 ui.innerHTML=`<div class="ov"><div class="box"><h2>Plains Knights</h2><p style="color:#f88">${msg}</p>
 <input id="un" placeholder="Username"> <input id="pw" type="password" placeholder="Password">
 <p>New account? Pick a class:</p><div>${Object.entries(CLS).map(([n,c])=>`<div class="cls ${n==pickCls?'sel':''}" style="background:${c.c}33" onclick="pickCls='${n}';authScreen()"><b style="color:${c.c}">${n}</b><br>${c.d}</div>`).join('')}</div>
 <p><button onclick="reg()">Create account</button> <button onclick="login()">Log in</button></p></div></div>`;
}
async function reg(){const n=$('un').value.trim(),p=$('pw').value;if(!n||p.length<3)return authScreen('Username and 3+ char password required');
 const u=users();if(u[n])return authScreen('Name taken');
 const s=newSave(pickCls);u[n]={h:await sha(p),s};saveUsers(u);start(n,s)}
async function login(){const n=$('un').value.trim(),u=users();if(!u[n]||u[n].h!==await sha($('pw').value))return authScreen('Wrong login');start(n,u[n].s)}
function newSave(cls){const w=mk(CLS[cls].start,0);return{cls,x:W/2,y:H/2,coins:0,xp:0,lvl:1,sp:0,sk:{hp:0,dmg:0,spd:0,regen:0},pouch:[],lo:{weapon:w,armor:null,boots:null,charm:null},hp:0,uid:uid}}
function start(name,s){S=s;S.name=name;uid=Math.max(uid,s.uid||1,...[...s.pouch,...Object.values(s.lo).filter(Boolean)].map(i=>i.id+1));
 S.hp=maxHp();ui.innerHTML='';spawnAll();running=true}
function persist(){if(!S)return;const u=users();S.uid=uid;const {name,...rest}=S;u[S.name].s=rest;saveUsers(u)}
setInterval(persist,5000);

// ---------- stats ----------
const C=()=>CLS[S.cls],gear=t=>S.lo[t];
const rm=i=>Math.pow(1.6,i.ri);
const maxHp=()=>100*C().hp*(1+.1*S.sk.hp)*(1+.03*S.lvl);
const regen=()=>1.5*C().regen*(1+.25*S.sk.regen);
const speed=()=>3*C().spd*(1+.06*S.sk.spd)*(1+(gear('boots')?gear('boots').b*rm(gear('boots')):0));
const luck=()=>C().luck*(1+(gear('charm')?gear('charm').b*rm(gear('charm')):0));
const defn=()=>gear('armor')?gear('armor').b*rm(gear('armor')):0;
const physM=()=>C().phys*(1+.1*S.sk.dmg);
function wdmg(){const w=gear('weapon');if(!w)return 4*physM();return w.b*rm(w)*(w.e?C().elem:C().wpn)*(1+.1*S.sk.dmg)}
function rollRar(){let i=0;while(i<8&&Math.random()<.3*luck())i++;return i}

// ---------- world ----------
let mobs=[],shots=[],chests=[],running=false,P={x:0,y:0,cd:0},cam={x:0,y:0},toastT=0,menu=null;
function spawnMob(t,x,y){const d=MT[t];mobs.push({t,x:x??Math.random()*W,y:y??Math.random()*H,hp:d.hp,mh:d.hp,cd:0})}
function spawnAll(){mobs=[];shots=[];P.x=S.x;P.y=S.y;
 chests=VILL.flatMap(([x,y])=>[0,1,2].map(k=>({x:x+(k-1)*120,y:y+30,t:0})));
 for(let i=0;i<70;i++)spawnMob(rr(['stone','soldier','witch','zombie']));
 VILL.forEach(([x,y])=>{for(let i=0;i<4;i++)spawnMob('villager',x+Math.random()*300-150,y+Math.random()*300-150)})}
function toast(s,c='#fff'){$('toast').innerHTML=`<span style="color:${c}">${s}</span>`;toastT=3}
function give(it){if(S.pouch.length>=60)return toast('Pouch full!','#f66');S.pouch.push(it);toast(`+ ${RAR[it.ri]} ${it.name}`,RC[it.ri])}
function killMob(m){const d=MT[m.t];S.coins+=d.coin[0]+(Math.random()*(d.coin[1]-d.coin[0]+1)|0);S.xp+=d.xp;
 while(S.xp>=S.lvl*40){S.xp-=S.lvl*40;S.lvl++;S.sp++;toast('Level up! +1 skill point','#ff0')}
 if(Math.random()<.35)give(mk(rr(d.drops),rollRar()));
 mobs.splice(mobs.indexOf(m),1);setTimeout(()=>{if(running)spawnMob(m.t)},8000)}
function hurtMob(m,d){m.hp-=d;if(m.hp<=0)killMob(m)}
function die(){toast('You died! Lost half your coins','#f66');S.coins=Math.floor(S.coins/2);P.x=W/2;P.y=H/2;S.hp=maxHp()}

// ---------- input ----------
const keys={};let mx=0,my=0,down=false;
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;keys[e.key.toLowerCase()]=1;
 if(!running)return;const k=e.key.toLowerCase();
 if(k=='k')openMenu('skills');if(k=='u')openMenu('upgrade');if(k=='p')openMenu('pouch');if(k=='escape')openMenu(null);if(k=='e')interact()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const cv=$('c'),g=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
cv.addEventListener('mousedown',e=>{down=true;mx=e.clientX;my=e.clientY});addEventListener('mouseup',()=>down=false);
function near(list,r){return list.find(o=>Math.hypot(o[0]-P.x,o[1]-P.y)<r)}
function interact(){if(menu)return;
 if(near(SHOPS,70)){shopStock=[...Array(6)].map(()=>mk(rr(Object.keys(IT)),Math.min(2,rollRar())));openMenu('shop');return}
 const c=chests.find(c=>!c.t&&Math.hypot(c.x-P.x,c.y-P.y)<60);
 if(c){c.t=1;S.coins+=10+Math.random()*30|0;for(let i=0;i<2;i++)give(mk(rr(Object.keys(IT)),rollRar()));setTimeout(()=>c.t=0,60000)}}

// ---------- update ----------
let last=performance.now();
function update(dt){
 if(menu)return;
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const l=Math.hypot(dx,dy)||1;P.x=Math.max(20,Math.min(W-20,P.x+dx/l*speed()*60*dt));P.y=Math.max(20,Math.min(H-20,P.y+dy/l*speed()*60*dt));
 S.hp=Math.min(maxHp(),S.hp+regen()*dt);
 const ang=Math.atan2(my-cv.height/2,mx-cv.width/2);P.cd-=dt;
 const w=gear('weapon');
 if(down&&P.cd<=0){P.cd=(w&&w.cd)||.4;
  if(w&&w.e)shots.push({x:P.x,y:P.y,vx:Math.cos(ang)*9,vy:Math.sin(ang)*9,d:wdmg(),l:70,pl:1});
  else mobs.slice().forEach(m=>{const a=Math.atan2(m.y-P.y,m.x-P.x),dd=Math.hypot(m.x-P.x,m.y-P.y);
   if(dd<95&&Math.abs(Math.atan2(Math.sin(a-ang),Math.cos(a-ang)))<1)hurtMob(m,wdmg())});
  P.sw=.15;P.ang=ang}
 P.sw-=dt;
 mobs.slice().forEach(m=>{const d=MT[m.t],dist=Math.hypot(P.x-m.x,P.y-m.y),a=Math.atan2(P.y-m.y,P.x-m.x);m.cd-=dt;
  if(dist<d.r+18)hurtMob(m,20*physM()*dt);  // body damage
  if(!mobs.includes(m))return;
  if(d.flee){if(dist<250){m.x-=Math.cos(a)*d.sp;m.y-=Math.sin(a)*d.sp}}
  else if(dist<450&&d.sp){const s=d.rng&&dist<250?-d.sp*.5:d.sp;m.x+=Math.cos(a)*s;m.y+=Math.sin(a)*s}
  if(d.rng&&dist<400&&m.cd<=0){m.cd=1.6;shots.push({x:m.x,y:m.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,d:9,l:90})}
  if(d.dm&&dist<d.r+18&&m.cd<=0){m.cd=.8;S.hp-=Math.max(1,d.dm-defn())}});
 shots.slice().forEach(s=>{s.x+=s.vx;s.y+=s.vy;if(--s.l<=0)return shots.splice(shots.indexOf(s),1);
  if(s.pl){const m=mobs.find(m=>Math.hypot(m.x-s.x,m.y-s.y)<MT[m.t].r+8);if(m){hurtMob(m,s.d);shots.splice(shots.indexOf(s),1)}}
  else if(Math.hypot(P.x-s.x,P.y-s.y)<20){S.hp-=Math.max(1,s.d-defn());shots.splice(shots.indexOf(s),1)}});
 if(S.hp<=0)die();
}

// ---------- draw ----------
function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function draw(){
 const cw=cv.width,ch=cv.height;cam.x=P.x-cw/2;cam.y=P.y-ch/2;
 g.fillStyle='#4f9a45';g.fillRect(0,0,cw,ch);
 g.save();g.translate(-cam.x,-cam.y);
 g.strokeStyle='#4a9040';for(let x=0;x<=W;x+=100){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<=H;y+=100){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 g.strokeStyle='#000';g.strokeRect(0,0,W,H);
 VILL.forEach(([x,y])=>{g.fillStyle='#a67c52';[[-200,-100],[100,-120],[-60,100],[170,80]].forEach(([a,b])=>g.fillRect(x+a,y+b,90,70));g.fillStyle='#d9c27a';g.fillRect(x-160,y-10,320,20)});
 chests.forEach(c=>{g.fillStyle=c.t?'#555':'#e0a030';g.fillRect(c.x-14,c.y-10,28,20)});
 SHOPS.forEach(([x,y])=>{circ(x,y,50,'#fc4');circ(x,y,38,'#c92');g.fillStyle='#000';g.textAlign='center';g.fillText('SHOP',x,y+4)});
 mobs.forEach(m=>{const d=MT[m.t];circ(m.x,m.y,d.r,d.c);g.fillStyle='#000';g.fillRect(m.x-16,m.y-d.r-8,32,4);g.fillStyle='#0f0';g.fillRect(m.x-16,m.y-d.r-8,32*m.hp/m.mh,4)});
 shots.forEach(s=>circ(s.x,s.y,6,s.pl?'#f90':'#c3f'));
 circ(P.x,P.y,18,C().c);g.strokeStyle='#000';g.lineWidth=2;g.stroke();
 if(P.sw>0){g.strokeStyle='#fff';g.beginPath();g.arc(P.x,P.y,70,P.ang-1,P.ang+1);g.stroke()}
 g.restore();
 // prompt
 if(!menu&&(near(SHOPS,70)||chests.some(c=>!c.t&&Math.hypot(c.x-P.x,c.y-P.y)<60))){g.fillStyle='#fff';g.font='16px sans-serif';g.textAlign='center';g.fillText('Press E',cw/2,ch/2-40)}
 // quarter-circle loadout HUD, bottom-right
 const R=90;g.fillStyle=C().c;g.globalAlpha=.85;g.beginPath();g.moveTo(cw,ch);g.arc(cw,ch,R,Math.PI,1.5*Math.PI);g.closePath();g.fill();g.globalAlpha=1;
 g.fillStyle='#000';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(S.cls,cw-R*.45,ch-R*.3);
 SLOTS.forEach((t,i)=>{const a=Math.PI+(i+.5)*(Math.PI/2)/4,x=cw+Math.cos(a)*(R+30),y=ch+Math.sin(a)*(R+30),it=S.lo[t];
  circ(x,y,24,'#000a');g.lineWidth=3;g.strokeStyle=it?RC[it.ri]:'#777';g.beginPath();g.arc(x,y,24,0,7);g.stroke();
  g.fillStyle='#fff';g.font='11px sans-serif';g.fillText(it?it.name.split(' ').map(w=>w[0]).join(''):t[0].toUpperCase(),x,y+4)});
 // hud
 $('hud').innerHTML=`<b>${S.name}</b> · ${S.cls} · Lv ${S.lvl} (${S.xp|0}/${S.lvl*40}) · Coins ${S.coins}<div class="bar"><i style="width:${Math.max(0,S.hp/maxHp()*100)}%"></i></div>HP ${S.hp|0}/${maxHp()|0} · DMG ${wdmg().toFixed(1)}${S.sp?` · <span style="color:#ff0">${S.sp} skill pts</span>`:''}<br>WASD move · click attack · E interact · K skills · U upgrade · P pouch`;
}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(running){update(dt);draw();if((toastT-=dt)<0)$('toast').innerHTML=''}requestAnimationFrame(loop)}

// ---------- menus ----------
let shopStock=[];
function openMenu(m){menu=m;down=false;if(!m){ui.innerHTML='';persist();return}render()}
function itCard(i,btns){return `<div class="it" style="border-color:${RC[i.ri]}"><b style="color:${RC[i.ri]}">${RAR[i.ri]}</b><br>${i.name}<br>${i.t}${i.e?' (elemental)':''}<br>${btns}</div>`}
function render(){
 const tabs=['skills','upgrade','pouch'].map(t=>`<button class="${menu==t?'on':''}" onclick="openMenu('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
 let b='';
 if(menu=='skills'){b=`<p>Skill points: <b>${S.sp}</b></p>`+[['hp','Health +10%'],['dmg','Damage +10%'],['spd','Speed +6%'],['regen','Regen +25%']].map(([k,d])=>`<p><b>${k.toUpperCase()}</b> Lv ${S.sk[k]} — ${d} <button onclick="addSk('${k}')">+</button></p>`).join('')}
 if(menu=='pouch'){b=`<h4>Loadout</h4>`+SLOTS.map(t=>S.lo[t]?itCard(S.lo[t],`<button onclick="unequip('${t}')">Unequip</button>`):`<div class="it" style="border-color:#555">${t}<br>(empty)</div>`).join('')+`<h4>Pouch (${S.pouch.length}/60)</h4>`+S.pouch.map((i,n)=>itCard(i,`<button onclick="equip(${n})">Equip</button><button onclick="drop(${n})">Drop</button>`)).join('')}
 if(menu=='upgrade'){const gr={};S.pouch.forEach(i=>(gr[key(i)]=gr[key(i)]||[]).push(i));
  b=`<p>Combine 5 identical items of the same rarity. Chance: ${CRAFT.map((c,i)=>`${RAR[i]}→${RAR[i+1]} ${c*100}%`).join(', ')}. Failed crafts lose the items.</p>`+
  Object.values(gr).filter(a=>a.length>=5).map(a=>itCard(a[0],`x${a.length}<br>${CRAFT[a[0].ri]!==undefined?`<button onclick="craft('${key(a[0])}')">Craft (${CRAFT[a[0].ri]*100}%)</button>`:'Max'}`)).join('')||'<p>No stacks of 5 yet.</p>'}
 if(menu=='shop'){b=`<h3>Shop — Coins: ${S.coins}</h3>`+shopStock.map((i,n)=>itCard(i,`<button onclick="buy(${n})">Buy ${price(i)}c</button>`)).join('')}
 ui.innerHTML=`<div class="ov"><div class="box"><div class="tabs">${menu=='shop'?'':tabs}<button onclick="openMenu(null)" style="float:right">Close</button></div>${b}</div></div>`}
const price=i=>Math.round(15*Math.pow(4,i.ri)*(i.t=='weapon'?1.5:1));
function addSk(k){if(S.sp>0){S.sp--;S.sk[k]++;S.hp=Math.min(S.hp,maxHp());render()}}
function equip(n){const i=S.pouch.splice(n,1)[0],old=S.lo[i.t];S.lo[i.t]=i;if(old)S.pouch.push(old);render()}
function unequip(t){if(S.pouch.length>=60)return;S.pouch.push(S.lo[t]);S.lo[t]=null;render()}
function drop(n){S.pouch.splice(n,1);render()}
function buy(n){const i=shopStock[n];if(S.coins<price(i))return toast('Not enough coins','#f66');if(S.pouch.length>=60)return;S.coins-=price(i);S.pouch.push(i);shopStock.splice(n,1);render()}
function craft(k){const a=S.pouch.filter(i=>key(i)==k).slice(0,5),b=a[0];S.pouch=S.pouch.filter(i=>!a.includes(i));
 if(Math.random()<CRAFT[b.ri]){S.pouch.push(mk(b.name,b.ri+1));toast(`Crafted ${RAR[b.ri+1]} ${b.name}!`,RC[b.ri+1])}else toast('Craft failed...','#f66');render()}

authScreen();requestAnimationFrame(loop);
</script></body></html>
