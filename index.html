<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plains RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="minimap" width="150" height="150" class="hidden"></canvas>
  <button id="menuBtn" class="hidden">☰ Menu</button>

  <div id="hud" class="hidden"></div>
  <div id="prompt"></div>
  <div id="toasts"></div>
  <div id="help" class="hidden">WASD / arrows: move · Auto-attack · E: shop / chest · Q: potion · Click slot: select · Double-click: equip</div>

  <div id="itempanel" class="hidden"></div>
  <div id="loadout" class="hidden">
    <div id="disc"></div>
    <div id="discLabel"></div>
    <div id="slots"></div>
  </div>

  <div id="shop" class="modal hidden"></div>

  <div id="classSelect" class="modal">
    <div class="cs-box">
      <h1>⚔️ Plains RPG</h1>
      <p class="dim">Choose your class. Slay stones, soldiers, witches, zombies and more, raid villages, trade at shop quarters and craft your gear.</p>
      <div id="classCards"></div>
      <button id="continueBtn" class="hidden"></button>
      <button id="menuClose">Back to game</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
