<!DOCTYPE html><html><head><meta charset="utf-8"><title>Realms.io - Plains</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="c"></canvas>
<div id="auth" class="ov"><div class="box"><h1>Realms.io</h1><p>Create an account to play (saved in this browser).</p>
<input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password">
<div><button onclick="auth(0)">Login</button><button onclick="auth(1)">Register</button></div><p id="err"></p></div></div>
<div id="wel" class="ov hide"><div class="box"><h1>Realms.io</h1><p id="wn"></p><button class="play" onclick="play()">PLAY</button><br><button onclick="logout()">Switch account</button></div></div>
<div id="cls" class="ov hide"><div class="box wide"><h1>Choose your class</h1><p>You can't switch without resetting ALL progress.</p><div id="cards"></div></div></div>
<div id="menu" class="ov hide"><div class="box wide"><div id="tabs"></div><div id="mbody"></div></div></div>
<script src="game.js"></script></body></html>
